name: CI/CD — Release, Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rebuild_version:
        description: "Version à (re)construire, ex. 1.2.0 (sans le préfixe v)"
        required: true
        type: string

# Sérialise les runs sur main pour ne pas laisser un release à moitié fait.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release (semantic-release)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Lancer semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve:
    name: Resolve build target
    if: always()
    runs-on: ubuntu-latest
    needs: release
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.rebuild_version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.release.outputs.new_release }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ needs.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push (v${{ needs.resolve.outputs.version }})
    runs-on: ubuntu-latest
    needs: resolve
    # always() : sans ça, ce job hérite silencieusement du skip de "release"
    # (skipped sur workflow_dispatch) à travers la chaîne needs -> resolve ->
    # build-and-push, même si resolve lui-même a réussi. Documenté ici pour ne
    # pas reproduire l'oubli sur update-manifests plus bas.
    if: always() && needs.resolve.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile.backend
            image: supplier-safety-form-backend
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.frontend
            image: supplier-safety-form-frontend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.resolve.outputs.version) || '' }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Métadonnées image ${{ matrix.component }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=latest
      - name: Build & push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-manifests:
    name: Update k8s manifests → v${{ needs.resolve.outputs.version }}
    runs-on: ubuntu-latest
    needs: [resolve, build-and-push]
    # Ne pas bump les manifestes si le build Docker a réellement échoué (pas
    # seulement "skipped" par la même condition que ci-dessus).
    if: always() && needs.resolve.outputs.build == 'true' && needs['build-and-push'].result != 'failure'
    steps:
      - name: Installer kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Checkout dépôt k8s
        uses: actions/checkout@v4
        with:
          repository: obeyler/k8s
          token: ${{ secrets.K8S_REPO_PAT }}
          path: k8s-repo
      - name: Mettre à jour les images — overlay dev
        working-directory: k8s-repo/supplier-safety-form/dev
        run: |
          kustomize edit set image \
            ghcr.io/drp-safe/supplier-safety-form-backend=ghcr.io/drp-safe/supplier-safety-form-backend:${{ needs.resolve.outputs.version }} \
            ghcr.io/drp-safe/supplier-safety-form-frontend=ghcr.io/drp-safe/supplier-safety-form-frontend:${{ needs.resolve.outputs.version }}
      - name: Mettre à jour les images — overlay prod
        working-directory: k8s-repo/supplier-safety-form/prod
        run: |
          kustomize edit set image \
            ghcr.io/drp-safe/supplier-safety-form-backend=ghcr.io/drp-safe/supplier-safety-form-backend:${{ needs.resolve.outputs.version }} \
            ghcr.io/drp-safe/supplier-safety-form-frontend=ghcr.io/drp-safe/supplier-safety-form-frontend:${{ needs.resolve.outputs.version }}
      - name: Committer et pousser
        working-directory: k8s-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supplier-safety-form/dev/kustomization.yaml supplier-safety-form/prod/kustomization.yaml
          git diff --cached --quiet && echo "Aucun changement à committer" || \
            (git commit -m "chore: bump supplier-safety-form to v${{ needs.resolve.outputs.version }}" && git push)
